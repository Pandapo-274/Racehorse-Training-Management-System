spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:rtms};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
# Mac dinh cua Flyway la classpath:db/migration, nhung file migration cua du an
# nam o classpath:migration. Khong co dong nay thi Flyway khong tim thay file
# nao, baseline-on-migrate lam no ghi nhan version 1 roi dung - database trong
# tron ma khong bao loi.
spring.flyway.locations=classpath:migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1