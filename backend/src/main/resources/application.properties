spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../.env[.properties]

spring.application.name=backend
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:rtms};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:migration
spring.flyway.validate-on-migrate=false
# Branches add migrations in parallel (V37/V38 training, V39 account security).
# A database already at V39 must still run V37/V38 when they arrive, not skip them.
spring.flyway.out-of-order=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend-base-url=http://localhost:3000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.google.client-id=${GOOGLE_CLIENT_ID:}

# Nhac lich phong ngua hang ngay (UC17). Cron 6 truong: giay phut gio ngay thang thu.
app.preventive.reminder.enabled=true
app.preventive.reminder.cron=0 0 7 * * *
app.preventive.reminder.zone=Asia/Ho_Chi_Minh

# Flow 4/5 rules (all optional; these are the defaults)
app.task.late-window-days=1
app.task.max-per-groom-per-day=12
app.task.missed.cron=0 15 0 * * *
app.supply.digest.enabled=true
app.supply.digest.cron=0 5 7 * * *
app.race.min-rest-days=14
app.race.trial-window-days=30
app.race.result.edit-window-days=7
app.lock.light-work-max-distance=800

# ---- V49: boarding contract and payOS ----
# Monthly fee in VND and package discounts ("months:percent,..."). payOS charges real money, so all
# prices are test-size (a few thousand VND, see V58). Set CONTRACT_MONTHLY_FEE in .env to change it.
app.contract.monthly-fee=${CONTRACT_MONTHLY_FEE:1000}
app.contract.discounts=${CONTRACT_DISCOUNTS:3:5,6:8,12:12}
app.contract.offer-days=7
app.contract.vet-emergency-cap=${CONTRACT_VET_CAP:5000}
app.contract.club-name=Tracen Club
app.contract.job.cron=0 30 0 * * *
app.contract.job.zone=Asia/Ho_Chi_Minh
# Keys of the payOS payment channel (my.payos.vn > Kenh thanh toan). Empty = contracts can be
# signed but not paid online; the owner sees a clear message.
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
