spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:rtms};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:migration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend-base-url=http://localhost:3000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.google.client-id=${GOOGLE_CLIENT_ID:}

# Nhac lich phong ngua hang ngay (UC17). Cron 6 truong: giay phut gio ngay thang thu.
app.preventive.reminder.enabled=true
app.preventive.reminder.cron=0 0 7 * * *
app.preventive.reminder.zone=Asia/Ho_Chi_Minh
